version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "monthly"
    labels: ["dependencies"]
    commit-message:
      prefix: "ci"

  - package-ecosystem: "maven"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "monthly"
    labels: ["dependencies"]
    commit-message:
      prefix: "build"
